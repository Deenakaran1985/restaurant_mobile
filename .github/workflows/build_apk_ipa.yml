name: 📱 Flutter Pure APK & IPA Release CI

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Release Build Version (e.g., v1.0.0-Universal)'
        required: true
        default: 'v1.0.0-Gold'

jobs:
  build_android_apk:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Auto-Generate Native Android Project Scaffold & Pin Toolchains
        run: |
          flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .
          python3 .github/scripts/sanitize_android_toolchains.py
          echo "=== VERIFYING SETTINGS AND BUILD SCRIPTS ==="
          cat android/settings.gradle* 2>/dev/null || true
          cat android/build.gradle* 2>/dev/null || true
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo "==========================================="

      - name: 📦 Install Flutter Dependencies & Sanitize Transitive Modules
        run: |
          flutter pub get
          python3 .github/scripts/sanitize_pub_cache.py

      - name: 🏗️ Build Master Universal Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build_ios_ipa:
    name: 🍎 Build Apple iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Setup Apple Command Line Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: ⚙️ Auto-Generate Native iOS Project Scaffold & CocoaPods Harness
        run: flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍏 Prepare Manual Signing & CocoaPods Dependencies
        run: |
          if [ -d "ios/Runner.xcodeproj" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj || true
          fi
          if [ -d "ios" ]; then
            cd ios && pod install --repo-update || echo "CocoaPods initialized automatically during flutter build"
          fi

      - name: 🏗️ Compile Unsigned Native iOS Release Bundle (.app)
        run: |
          echo "Preparing Flutter iOS assets and configuration..."
          flutter build ios --release --config-only || flutter build ios --release --no-codesign || true
          rm -rf build/ios/Release-iphoneos/*
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd ios
          echo "Compiling native ARM64 physical device bundle via Xcode..."
          xcodebuild clean build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" -quiet || {
            echo "Retrying compilation with Ad-Hoc code signing override..."
            xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE="Manual" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED="YES" CODE_SIGNING_ALLOWED="YES" AD_HOC_CODE_SIGNING_ALLOWED="YES" -quiet
          }

      - name: 📦 Package .app into Distributable iOS .IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" 2>/dev/null | head -n 1)
          fi
          echo "Compiled Runner.app located at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r restaurant-mobile-ios.ipa Payload
          ls -lh restaurant-mobile-ios.ipa

      - name: 📤 Upload Release iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-release-ipa
          path: restaurant-mobile-ios.ipa
          retention-days: 30
