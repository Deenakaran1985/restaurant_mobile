name: 📱 Flutter Pure APK & IPA Release CI

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Release Build Version (e.g., v1.0.0-Universal)'
        required: true
        default: 'v1.0.0-Gold'

jobs:
  build_android_apk:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Auto-Generate Native Android Project Scaffold & Pin AGP 8.5.2 / Kotlin 2.0.20
        run: |
          flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .
          echo "=== BEFORE TOOLCHAIN MODIFICATION ==="
          cat android/settings.gradle* 2>/dev/null || true
          cat android/build.gradle* 2>/dev/null || true
          echo "====================================="
          echo "Enforcing stable AGP 8.5.2 and Kotlin 2.0.20 across all Android build scripts..."
          python3 -c '
import os, re
for root, _, files in os.walk("android"):
    for f in files:
        if f.endswith(".gradle") or f.endswith(".kts") or f.endswith(".properties"):
            p = os.path.join(root, f)
            c = open(p, "r").read()
            orig = c
            c = re.sub(r"(id\s*[\(\"\x27]com\.android\.application[\)\"\x27]\s*version\s*[\"\x27])[^\"\x27]+([\"\x27])", r"\g<1>8.5.2\2", c)
            c = re.sub(r"(id\s*[\(\"\x27]com\.android\.library[\)\"\x27]\s*version\s*[\"\x27])[^\"\x27]+([\"\x27])", r"\g<1>8.5.2\2", c)
            c = re.sub(r"(com\.android\.tools\.build:gradle:)[0-9\.]+", r"\g<1>8.5.2", c)
            c = re.sub(r"(id\s*[\(\"\x27]org\.jetbrains\.kotlin\.android[\)\"\x27]\s*version\s*[\"\x27])[^\"\x27]+([\"\x27])", r"\g<1>2.0.20\2", c)
            c = re.sub(r"(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9\.]+", r"\g<1>2.0.20", c)
            c = re.sub(r"ext\.kotlin_version\s*=\s*[\"\x27][^\"\x27]+[\"\x27]", "ext.kotlin_version = \x272.0.20\x27", c)
            if c != orig:
                open(p, "w").write(c)
                print("Updated toolchains in:", p)
'
          if [ -f "android/build.gradle.kts" ]; then
            if ! grep -q "kotlin-gradle-plugin" android/build.gradle.kts; then
              printf '\nbuildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20")\n    }\n}\n' >> android/build.gradle.kts
            fi
          elif [ -f "android/build.gradle" ]; then
            if ! grep -q "kotlin-gradle-plugin" android/build.gradle; then
              sed -i '/dependencies {/a \        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20"' android/build.gradle || true
            fi
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i "s/gradle-[0-9]\+\(\.[0-9]\+\)\+-\(all\|bin\)\.zip/gradle-8.9-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          mkdir -p ~/.gradle
          echo "android.newDsl=false" >> ~/.gradle/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties || true
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties || true
          echo "=== AFTER TOOLCHAIN MODIFICATION ==="
          cat android/settings.gradle* 2>/dev/null || true
          cat android/build.gradle* 2>/dev/null || true
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo "===================================="

      - name: 📦 Install Flutter Dependencies & Sanitize jni Module
        run: |
          flutter pub get
          echo "Sanitizing jni plugin build.gradle in pub-cache..."
          python3 -c 'import glob, os, re; [open(p, "w").write(re.sub(r"if\s*\([^)]*namespace[^)]*\)\s*\{\s*namespace\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]\s*\}", r"namespace \x27\1\x27", re.sub(r"kotlin\s*\{\s*[^{}]*jvmToolchain[^{}]*\}", "", open(p).read()))) for p in glob.glob(os.path.expanduser("~/.pub-cache/**/jni-*/android/build.gradle"), recursive=True)]' || true

      - name: 🏗️ Build Master Universal Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build_ios_ipa:
    name: 🍎 Build Apple iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Setup Apple Command Line Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: ⚙️ Auto-Generate Native iOS Project Scaffold & CocoaPods Harness
        run: flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍏 Prepare Manual Signing & CocoaPods Dependencies
        run: |
          if [ -d "ios/Runner.xcodeproj" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj || true
          fi
          if [ -d "ios" ]; then
            cd ios && pod install --repo-update || echo "CocoaPods initialized automatically during flutter build"
          fi

      - name: 🏗️ Compile Unsigned Native iOS Release Bundle (.app)
        run: |
          echo "Preparing Flutter iOS assets and configuration..."
          flutter build ios --release --config-only || flutter build ios --release --no-codesign || true
          rm -rf build/ios/Release-iphoneos/*
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd ios
          echo "Compiling native ARM64 physical device bundle via Xcode..."
          xcodebuild clean build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" -quiet || {
            echo "Retrying compilation with Ad-Hoc code signing override..."
            xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE="Manual" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED="YES" CODE_SIGNING_ALLOWED="YES" AD_HOC_CODE_SIGNING_ALLOWED="YES" -quiet
          }

      - name: 📦 Package .app into Distributable iOS .IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" 2>/dev/null | head -n 1)
          fi
          echo "Compiled Runner.app located at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r restaurant-mobile-ios.ipa Payload
          ls -lh restaurant-mobile-ios.ipa

      - name: 📤 Upload Release iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-release-ipa
          path: restaurant-mobile-ios.ipa
          retention-days: 30
