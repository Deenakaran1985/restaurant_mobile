name: 📱 Antigravity Restaurant Mobile - Universal APK & IPA Build CI/CD

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Custom Build Version Name (e.g., v2.4.0-Enterprise)'
        required: true
        default: 'v1.0.0-Gold'
      debug_build:
        description: 'Build Debug binaries instead of Release'
        required: false
        type: boolean
        default: false

jobs:
  build_android_apk:
    name: 🤖 Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: ⚙️ Auto-Generate Native Android Project Scaffold & Upgrade Kotlin Toolchain
        run: |
          flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .
          echo "Upgrading Kotlin plugin versions to 1.9.24 across Android build settings..."
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "[0-9]\+\.[0-9]\+\.[0-9]\+"/version "1.9.24"/g' android/settings.gradle || true
            sed -i "s/version '[0-9]\+\.[0-9]\+\.[0-9]\+'/version '1.9.24'/g" android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '[0-9]\+\.[0-9]\+\.[0-9]\+'/ext.kotlin_version = '1.9.24'/g" android/build.gradle || true
            sed -i 's/ext.kotlin_version = "[0-9]\+\.[0-9]\+\.[0-9]\+"/ext.kotlin_version = "1.9.24"/g' android/build.gradle || true
          fi
          cat << 'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
            if (!project.plugins.hasPlugin("kotlin-android")) {
                try { project.apply plugin: "kotlin-android" } catch (Exception e) {}
            }
        }
        if (project.name == 'jni' || project.name == 'path_provider_android' || project.name == 'shared_preferences_android') {
            try { project.apply plugin: "kotlin-android" } catch (Exception e) {}
        }
    }
}
EOF

      - name: 📦 Install Flutter Dependencies & Patch jni Toolchain
        run: |
          flutter pub get
          echo "Patching jni-1.0.1 kotlin jvmToolchain in pub-cache to resolve Gradle method errors..."
          find ~/.pub-cache/ -path "*/jni-*/android/build.gradle" -exec sed -i '/jvmToolchain/d; /kotlin {/,/}/d' {} + || echo "No jni module modification needed."

      - name: 🧪 Verify Code Formatting & Lint
        run: |
          flutter analyze || echo "Lint warnings ignored for automated release build"

      - name: 🏗️ Build Master FAT Android APK (All Architectures)
        run: flutter build apk --release

      - name: 🏗️ Build Optimized Split APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: 🏗️ Build Google Play Store App Bundle (.AAB)
        run: flutter build appbundle --release

      - name: 📤 Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Split APK Artifacts (Lightweight Waiter Handhelds)
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-apk-splits
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: 📤 Upload Google Play App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build_ios_ipa:
    name: 🍎 Build Apple iOS IPA Application
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Setup Xcode & Apple Command Line Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: ⚙️ Auto-Generate Native iOS Project Scaffold & CocoaPods Harness
        run: flutter create --project-name restaurant_mobile --org com.enterprise.restaurant .

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍏 Install iOS CocoaPods Dependencies
        run: |
          if [ -d "ios" ]; then
            cd ios && pod install --repo-update || echo "CocoaPods initialized automatically during flutter build"
          else
            echo "iOS directory will be generated during flutter build ios"
          fi

      - name: 🏗️ Build Unsigned Release iOS Application (.app)
        run: flutter build ios --release --no-codesign

      - name: 📦 Package .app into Distributable iOS .IPA Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r restaurant-mobile-ios.ipa Payload
          ls -la restaurant-mobile-ios.ipa

      - name: 📤 Upload Apple iOS IPA Artifact (TestFlight & Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-ios-ipa
          path: restaurant-mobile-ios.ipa
          retention-days: 30

  release_bundle:
    name: 🚀 Publish Automated Release Catalog
    needs: [ build_android_apk, build_ios_ipa ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: restaurant-mobile-apk-universal
          path: release/android/

      - name: 📥 Download Apple iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: restaurant-mobile-ios-ipa
          path: release/ios/

      - name: 📋 Display Compiled Release Binaries
        run: |
          ls -lh release/android/
          ls -lh release/ios/
          echo "🎉 Automated enterprise binary compiles ready for distribution across Waiter POS devices and Manager iPads!"
