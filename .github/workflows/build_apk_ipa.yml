name: 📱 Flutter Pure APK & IPA Release CI

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Release Build Version (e.g., v1.0.0-Universal)'
        required: true
        default: 'v1.0.0-Gold'

jobs:
  build_android_apk:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Auto-Generate Native Android Project Scaffold & Pin Toolchains
        run: |
          flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .
          python3 .github/scripts/sanitize_android_toolchains.py
          echo "=== VERIFYING SETTINGS AND BUILD SCRIPTS ==="
          cat android/settings.gradle* 2>/dev/null || true
          cat android/build.gradle* 2>/dev/null || true
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo "==========================================="

      - name: 📦 Install Flutter Dependencies & Sanitize Transitive Modules
        run: |
          flutter pub get
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons
          python3 .github/scripts/sanitize_pub_cache.py

      - name: 🏗️ Build Master Universal Android APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk Sriinnov-Restaurant-Management-POS.apk
          ls -lh Sriinnov-Restaurant-Management-POS.apk

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sriinnov-Restaurant-Management-POS.apk
          path: Sriinnov-Restaurant-Management-POS.apk
          retention-days: 30

  build_ios_ipa:
    name: 🍎 Build Apple iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Setup Apple Command Line Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: ⚙️ Auto-Generate Native iOS Project Scaffold & CocoaPods Harness
        run: flutter create --project-name restaurant_mobile --org com.enterprise.restaurant -a kotlin -i swift .

      - name: 📦 Install Flutter Dependencies & Generate Brand Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons

      - name: 🍏 Prepare Manual Signing & CocoaPods Dependencies
        run: |
          if [ -d "ios/Runner.xcodeproj" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj || true
          fi
          if [ -d "ios" ]; then
            cd ios && pod install --repo-update || echo "CocoaPods initialized automatically during flutter build"
          fi

      - name: 🏗️ Compile Unsigned Native iOS Release Bundle (.app)
        run: |
          echo "Preparing Flutter iOS assets and configuration..."
          flutter build ios --release --config-only || flutter build ios --release --no-codesign || true
          rm -rf build/ios/Release-iphoneos/*
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd ios
          echo "Compiling native ARM64 physical device bundle via Xcode..."
          xcodebuild clean build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" -quiet || {
            echo "Retrying compilation with Ad-Hoc code signing override..."
            xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE="Manual" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED="YES" CODE_SIGNING_ALLOWED="YES" AD_HOC_CODE_SIGNING_ALLOWED="YES" -quiet
          }

      - name: 📦 Package .app into Distributable iOS .IPA Payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" 2>/dev/null | head -n 1)
          fi
          echo "Compiled Runner.app located at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Sriinnov-Restaurant-Management-iOS.ipa Payload
          ls -lh Sriinnov-Restaurant-Management-iOS.ipa

      - name: 📤 Upload Release iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sriinnov-Restaurant-Management-iOS.ipa
          path: Sriinnov-Restaurant-Management-iOS.ipa
          retention-days: 30

  publish_direct_release:
    name: 🚀 Publish Direct APK & IPA Download Release
    needs: [ build_android_apk, build_ios_ipa ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Compiled Android APK
        uses: actions/download-artifact@v4
        with:
          name: Sriinnov-Restaurant-Management-POS.apk
          path: ./release-binaries

      - name: 📥 Download Compiled Apple iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: Sriinnov-Restaurant-Management-iOS.ipa
          path: ./release-binaries

      - name: 📦 Verify Downloaded Binaries
        run: |
          ls -lh ./release-binaries/

      - name: 🚀 Publish Direct Downloadable Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG_NAME="v1.0-latest"
          
          # Remove old release and tag if present so we cleanly replace binary assets
          gh release delete "$TAG_NAME" --cleanup-tag -y 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push -d origin "$TAG_NAME" 2>/dev/null || true
          
          # Create updated tag pointing to current master commit
          git tag -f -a "$TAG_NAME" -m "Automated Direct Release Binaries"
          git push -f origin "$TAG_NAME"
          
          # Publish direct downloadable APK & IPA files to GitHub Releases
          gh release create "$TAG_NAME" \
            --title "📱 Sriinnov Restaurant POS - Direct APK & IPA Release" \
            --notes "### 🎉 Instant Direct Installation Binaries
          Click the **.apk** or **.ipa** links under **Assets** below to instantly download and install directly onto your POS terminal tablets, smartphones, and KDS screens without needing to unzip workflow archives!
          
          #### ✨ Highlights in this Build:
          * **Rebranded Identity**: Full Sriinnov Restaurant Management titles, menus, and custom logo launcher icon.
          * **Password-Protected Server Config**: Tap the Host badge on the login terminal screen (default pass: \`admin\`) to dynamically switch Laravel server host IPs and kitchen thermal printer IPs without reinstalling.
          * **Responsive Mobile Architecture**: Adaptive layout engines for handheld smartphones, compact phones, and widescreen POS tablets.
          
          ---
          *🕒 Automatically compiled from branch \`${GITHUB_REF_NAME}\` via GitHub Actions.*" \
            ./release-binaries/Sriinnov-Restaurant-Management-POS.apk \
            ./release-binaries/Sriinnov-Restaurant-Management-iOS.ipa \
            --latest
